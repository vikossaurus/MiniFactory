<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Factory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="screen">
  <div class="card">
    <h1>🏭 Mini Factory</h1>
    <p>Constrói, automatiza e domina o leaderboard.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <input id="username" placeholder="Username (só no registo)" maxlength="20">
    <div class="row"><button id="loginBtn">Entrar</button><button id="signupBtn">Criar conta</button></div>
    <p id="authMsg" class="muted"></p>
  </div>
</div>

<div id="app" hidden>
<header>
  <b>🏭 MINI FACTORY</b>
  <span>👤 <b id="me"></b></span>
  <span>💰 <b id="money">500</b>€</span>
  <span>⛏ <b id="iron">0</b></span>
  <span>🔩 <b id="plates">0</b></span>
  <span>⚡ <b id="energy">0</b></span>
  <button id="saveBtn">Guardar</button>
  <button id="exploreBtn">🌍 Explorar</button>
  <button id="leaderBtn">🏆 Ranking</button>
  <button id="logoutBtn">Sair</button>
</header>
<canvas id="world"></canvas>
<aside>
  <h3 id="selName">Construção</h3>
  <p id="selInfo" class="muted">Escolhe uma estrutura e clica no mapa.</p>
  <hr>
  <b>Objetivo</b>
  <p class="muted">Produz barras de ferro e vende-as.</p>
  <label><input id="publicFactory" type="checkbox"> Fábrica pública</label>
</aside>
<nav id="buildbar">
  <button data-type="miner">⛏ Minerador<br><small>50€</small></button>
  <button data-type="belt">➡ Tapete<br><small>5€</small></button>
  <button data-type="furnace">🔥 Fornalha<br><small>80€</small></button>
  <button data-type="storage">📦 Armazém<br><small>40€</small></button>
  <button data-type="generator">⚡ Gerador<br><small>100€</small></button>
  <button id="sellBtn">💰 Vender</button>
</nav>
</div>

<div id="modal" class="screen" hidden>
  <div class="modal card">
    <button class="close">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
